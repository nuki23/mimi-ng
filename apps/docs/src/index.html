<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Mimi · Componentes para Angular y Tailwind CSS</title>
    <meta
      name="description"
      content="Componentes para Angular 22 y Tailwind CSS 4 que una CLI copia a tu proyecto. Un solo prefijo, tema opcional y tipado, y actualizaciones que respetan tus cambios."
    />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Aplica .dark antes de que cargue Angular para evitar el parpadeo. Misma clave que ThemeService. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('mimi-docs-theme');
          var dark = stored
            ? stored === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <!-- Marca (R.25): copias de docs/brand/. El SVG primero; el .ico, para los navegadores sin SVG. -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" href="favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="theme-color" content="#793EEA" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#17161D" media="(prefers-color-scheme: dark)" />
    <!-- Vista previa al compartir. og-image.png lo genera apps/docs/scripts/og-image.mjs. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mimi" />
    <meta property="og:title" content="Mimi · Componentes para Angular y Tailwind CSS" />
    <meta
      property="og:description"
      content="Componentes para Angular 22 y Tailwind CSS 4 que una CLI copia a tu proyecto. Los componentes son tuyos. Las actualizaciones también."
    />
    <meta property="og:url" content="https://ng.mimiworks.dev/" />
    <meta property="og:image" content="https://ng.mimiworks.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Mimi. Los componentes son tuyos. Las actualizaciones también."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Outfit solo se carga en el showcase; ui-core no carga fuentes -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
