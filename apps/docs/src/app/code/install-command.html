<div class="overflow-hidden rounded-card border bg-card">
  <mimi-tabs
    preserveContent
    aria-label="Forma de instalar"
    class="ms-3 w-64 border-b-0"
    [panelClass]="panelClass"
    style="gap: 0"
  >
    @for (tab of tabs(); track tab.id) {
      <ng-template [mimiTab]="tab.id" [label]="tab.label">
        <app-code-block
          [code]="tab.command"
          lang="bash"
          prompt="$"
          [bordered]="false"
          label="Comando de instalación"
        />
      </ng-template>
    }
  </mimi-tabs>
</div>
