<div class="relative overflow-hidden rounded-card border bg-card shadow-card">
  <!-- Antes de las pestañas en el DOM (orden de Tab: Copiar, pestañas, panel); se ve a la derecha. -->
  <app-copy-button class="absolute end-2 top-3 z-10" [text]="code()" [withLabel]="true" />

  <mimi-tabs
    variant="pill"
    preserveContent
    aria-label="Vista del ejemplo"
    class="m-1.5 ms-3 w-52"
    [panelClass]="panelClass"
    style="gap: 0"
  >
    <ng-template mimiTabLabel="preview">
      <svg lucideEye aria-hidden="true"></svg>
      Preview
    </ng-template>
    <ng-template mimiTab="preview" label="Preview">
      <div
        data-slot="example"
        class="relative m-3 flex min-h-[260px] items-center justify-center rounded-lg border border-dashed bg-background p-10"
      >
        <div aria-hidden="true" class="absolute top-2.5 left-3 flex gap-1.5">
          <span class="size-2 rounded-full border"></span>
          <span class="size-2 rounded-full border"></span>
          <span class="size-2 rounded-full border"></span>
        </div>
        <ng-content />
      </div>
    </ng-template>

    <ng-template mimiTabLabel="code">
      <svg lucideCode aria-hidden="true"></svg>
      Código
    </ng-template>
    <ng-template mimiTab="code" label="Código">
      <app-code-block
        class="max-h-[480px] overflow-y-auto"
        [code]="code()"
        [lang]="lang()"
        [bordered]="false"
        [copyable]="false"
        [roomy]="true"
        label="Código del ejemplo"
      />
    </ng-template>
  </mimi-tabs>
</div>
