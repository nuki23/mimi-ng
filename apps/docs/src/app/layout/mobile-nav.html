<dialog
  #dialog
  id="docs-mobile-nav"
  aria-label="Navegación"
  class="m-0 mr-auto h-dvh max-h-dvh w-[280px] max-w-[85vw] border-r bg-background p-0 text-foreground shadow-card backdrop:bg-overlay lg:hidden"
  (close)="nav.close()"
  (click)="onDialogClick($event)"
>
  <div class="flex h-full flex-col">
    <div class="flex h-15 shrink-0 items-center justify-between border-b px-5">
      <span class="text-[17px] font-bold tracking-[-0.02em]">Mimi</span>
      <button
        type="button"
        mimiBtn
        variant="ghost"
        size="icon"
        class="-mr-2 size-9 rounded-[min(var(--mimi-radius),10px)] [&_svg]:size-[18px]"
        aria-label="Cerrar menú"
        (click)="nav.close()"
      >
        <svg lucideX [size]="18" aria-hidden="true"></svg>
      </button>
    </div>
    <div class="flex-1 overflow-y-auto px-5 py-8">
      <app-docs-sidebar />
    </div>
  </div>
</dialog>
