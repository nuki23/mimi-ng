<header
  class="sticky top-0 z-20 flex h-15 items-center gap-3 border-b bg-background/78 px-6 backdrop-blur-[14px]"
>
  <button
    type="button"
    mimiBtn
    variant="ghost"
    size="icon"
    class="-ml-2 size-9 rounded-[min(var(--mimi-radius),10px)] lg:hidden [&_svg]:size-[18px]"
    aria-label="Abrir menú"
    aria-controls="docs-mobile-nav"
    [attr.aria-expanded]="mobileNav.isOpen()"
    (click)="mobileNav.open()"
  >
    <!-- Lucide menu (ISC), en línea para que @lucide/angular no entre en el bundle inicial -->
    <svg
      width="18"
      height="18"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M4 5h16" />
      <path d="M4 12h16" />
      <path d="M4 19h16" />
    </svg>
  </button>

  <a
    routerLink="/"
    aria-label="Mimi, inicio"
    class="-ml-1 flex items-center gap-2 rounded-lg p-1 text-foreground mimi-transition focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ring active:scale-(--mimi-press-scale)"
  >
    <span
      aria-hidden="true"
      class="inline-flex size-7 items-center justify-center rounded-[min(var(--mimi-radius),9px)] bg-primary text-base leading-none font-extrabold text-primary-foreground shadow-primary"
    >
      m
    </span>
    <span class="text-[17px] font-bold tracking-[-0.02em]">Mimi</span>
  </a>

  <span
    class="inline-flex h-[22px] items-center rounded-badge border px-2 font-mono text-xs text-muted-foreground"
  >
    v{{ site.version }}
  </span>

  <div class="flex-1"></div>

  <a
    [href]="site.githubUrl"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="Repositorio de Mimi en GitHub"
    mimiBtn
    variant="ghost"
    size="icon"
    class="size-9 rounded-[min(var(--mimi-radius),10px)] [&_svg]:size-[18px]"
  >
    <!-- Octicon mark-github (MIT, © GitHub). Lucide ya no incluye logos de marcas. -->
    <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
      <path
        d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"
      />
    </svg>
  </a>

  <button
    type="button"
    mimiBtn
    variant="ghost"
    size="icon"
    class="size-9 rounded-[min(var(--mimi-radius),10px)] [&_svg]:size-[18px]"
    [attr.aria-label]="theme.isDark() ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
    (click)="theme.toggle()"
  >
    @if (theme.isDark()) {
      <!-- Lucide sun (ISC), en línea para que @lucide/angular no entre en el bundle inicial -->
      <svg
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <circle cx="12" cy="12" r="4" />
        <path d="M12 2v2" />
        <path d="M12 20v2" />
        <path d="m4.93 4.93 1.41 1.41" />
        <path d="m17.66 17.66 1.41 1.41" />
        <path d="M2 12h2" />
        <path d="M20 12h2" />
        <path d="m6.34 17.66-1.41 1.41" />
        <path d="m19.07 4.93-1.41 1.41" />
      </svg>
    } @else {
      <!-- Lucide moon (ISC), en línea para que @lucide/angular no entre en el bundle inicial -->
      <svg
        width="18"
        height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path
          d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"
        />
      </svg>
    }
  </button>
</header>
