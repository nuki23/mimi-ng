<nav aria-label="Documentación" class="flex flex-col gap-6">
  @for (section of sections(); track section.title) {
    <div class="flex flex-col gap-0.5" [attr.data-section]="section.title">
      <h2
        class="px-3 pb-1.5 text-xs font-semibold tracking-[.06em] text-muted-foreground uppercase"
      >
        {{ section.title }}
      </h2>
      <ul class="flex flex-col gap-0.5">
        @for (item of section.items; track item.path) {
          <li>
            @switch (item.status) {
              @case ('ready') {
                <a
                  [routerLink]="item.path"
                  routerLinkActive
                  ariaCurrentWhenActive="page"
                  class="flex min-h-[34px] w-full items-center rounded-lg px-3 py-[7px] text-sm leading-[1.35] font-medium text-muted-foreground mimi-transition hover:bg-accent hover:text-accent-foreground aria-[current=page]:bg-secondary aria-[current=page]:font-semibold aria-[current=page]:text-secondary-foreground focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ring active:scale-(--mimi-press-scale)"
                >
                  {{ item.title }}
                </a>
              }
              @case ('soon') {
                <span
                  aria-disabled="true"
                  class="flex min-h-[34px] items-center justify-between gap-2 px-3 text-sm text-muted-foreground opacity-55"
                >
                  {{ item.title }}
                  <span
                    class="inline-flex h-[18px] items-center rounded-badge border px-[7px] text-[10px] font-semibold tracking-[.02em]"
                  >
                    Próximamente
                  </span>
                </span>
              }
              @default {
                <span
                  aria-disabled="true"
                  class="flex min-h-[34px] items-center px-3 py-[7px] text-sm leading-[1.35] text-muted-foreground opacity-55"
                >
                  {{ item.title }}
                </span>
              }
            }
          </li>
        }
      </ul>
    </div>
  }
</nav>
