<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<nav aria-label="Paginación" style="display:inline-flex;align-items:center;width:max-content;max-width:100%;box-sizing:border-box;border-radius:999px;background:var(--mimi-glass);border:1px solid var(--mimi-glass-border);backdrop-filter:blur(var(--mimi-glass-blur)) saturate(1.4);-webkit-backdrop-filter:blur(var(--mimi-glass-blur)) saturate(1.4);font-family:var(--mimi-font-sans);color:var(--mimi-foreground);gap:{{ gap }};padding:{{ pad }};font-size:{{ fs }};box-shadow:{{ shadow }};position:{{ pos }};left:{{ left }};bottom:{{ bottom }};transform:{{ tf }};z-index:{{ z }}">
  <button aria-label="Página anterior" disabled="{{ prevDis }}" onClick="{{ prev }}" style="display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;padding:0;border:0;border-radius:999px;background:transparent;color:var(--mimi-foreground);transition:var(--mimi-transition);width:{{ h }};height:{{ h }};opacity:{{ prevOp }};cursor:{{ prevCur }}" style-hover="background:var(--mimi-accent)" style-active="transform:scale(0.88)"><mimi-icon name="chevron-left" size="{{ is }}"></mimi-icon></button>
  <div style="position:relative;display:flex;align-items:center;gap:{{ gap }}">
    <sc-if value="{{ error }}"><span role="alert" style="position:absolute;bottom:calc(100% + 12px);left:50%;transform:translateX(-50%);padding:5px 9px;border-radius:7px;background:var(--mimi-destructive);color:var(--mimi-destructive-foreground);font-size:12px;font-weight:600;white-space:nowrap;box-shadow:var(--mimi-shadow-destructive)">Entre 1 y {{ total }}<span style="position:absolute;left:50%;bottom:-4px;width:8px;height:8px;margin-left:-4px;background:var(--mimi-destructive);transform:rotate(45deg)"></span></span></sc-if>
    <input aria-label="Página" inputmode="numeric" aria-invalid="{{ ariaInvalid }}" value="{{ text }}" onChange="{{ onText }}" onKeyDown="{{ onKey }}" onBlur="{{ onBlur }}" onFocus="{{ onFocus }}" style="box-sizing:border-box;padding:0 4px;border-radius:999px;background:var(--mimi-input-background);color:var(--mimi-foreground);font-family:var(--mimi-font-sans);font-weight:600;font-variant-numeric:tabular-nums;text-align:center;outline:none;transition:var(--mimi-transition);width:{{ iw }};height:{{ h }};font-size:{{ fs }};border:1px solid {{ border }};box-shadow:{{ ring }}" style-hover="border-color:var(--mimi-input-hover)">
    <span style="font-variant-numeric:tabular-nums;color:var(--mimi-muted-foreground);white-space:nowrap;padding-right:2px">/ {{ total }}</span>
  </div>
  <button aria-label="Página siguiente" disabled="{{ nextDis }}" onClick="{{ next }}" style="display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;padding:0;border:0;border-radius:999px;background:transparent;color:var(--mimi-foreground);transition:var(--mimi-transition);width:{{ h }};height:{{ h }};opacity:{{ nextOp }};cursor:{{ nextCur }}" style-hover="background:var(--mimi-accent)" style-active="transform:scale(0.88)"><mimi-icon name="chevron-right" size="{{ is }}"></mimi-icon></button>
  <sc-if value="{{ showSize }}">
    <span aria-hidden="true" style="width:1px;height:18px;margin:0 2px;background:var(--mimi-border)"></span>
    <div style="position:relative">
      <button aria-haspopup="listbox" aria-expanded="{{ ariaOpen }}" aria-label="Registros por página" onClick="{{ toggle }}" onKeyDown="{{ selKey }}" style="display:inline-flex;align-items:center;gap:4px;padding:0 8px 0 10px;border:0;border-radius:999px;font-family:var(--mimi-font-sans);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;cursor:pointer;transition:var(--mimi-transition);height:{{ h }};font-size:{{ fs }};background:{{ selBg }};color:var(--mimi-foreground)" style-hover="background:var(--mimi-accent)" style-active="transform:scale(0.95)">{{ size }} / pág.<span style="display:inline-flex;color:var(--mimi-muted-foreground);transition:transform .2s ease;transform:{{ chev }}"><mimi-icon name="chevron-up" size="14"></mimi-icon></span></button>
      <sc-if value="{{ open }}">
        <div role="listbox" aria-label="Registros por página" style="position:absolute;right:0;bottom:calc(100% + 10px);min-width:120px;padding:4px;display:flex;flex-direction:column;gap:1px;background:var(--mimi-popover);border:1px solid var(--mimi-border);border-radius:var(--mimi-radius);box-shadow:var(--mimi-shadow-popover);z-index:5">
          <sc-for list="{{ sizes }}" as="o"><div role="option" aria-selected="{{ o.aria }}" onClick="{{ o.pick }}" style="display:flex;align-items:center;gap:8px;height:30px;padding:0 10px;border-radius:var(--mimi-radius-sm);font-size:13px;font-variant-numeric:tabular-nums;cursor:pointer;background:{{ o.bg }}" style-hover="background:var(--mimi-accent)" style-active="transform:scale(0.98)"><span style="flex:1">{{ o.label }}</span><sc-if value="{{ o.on }}"><mimi-icon name="check" size="14"></mimi-icon></sc-if></div></sc-for>
        </div>
      </sc-if>
    </div>
  </sc-if>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;360px&quot;,&quot;height&quot;:&quot;160px&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;sm&quot;,&quot;md&quot;],&quot;default&quot;:&quot;sm&quot;,&quot;tsType&quot;:&quot;'sm' | 'md'&quot;},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;inline&quot;,&quot;floating&quot;],&quot;default&quot;:&quot;inline&quot;,&quot;tsType&quot;:&quot;'inline' | 'floating'&quot;},&quot;mobile&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;page&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:1,&quot;tsType&quot;:&quot;number&quot;},&quot;total&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:24,&quot;tsType&quot;:&quot;number&quot;},&quot;pageSize&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;10&quot;,&quot;25&quot;,&quot;50&quot;,&quot;100&quot;],&quot;default&quot;:&quot;10&quot;,&quot;tsType&quot;:&quot;number&quot;},&quot;invalidText&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;open&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onPageChange&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(page: number) =&gt; void&quot;},&quot;onSizeChange&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(size: number) =&gt; void&quot;}}">
const SIZES = [10, 25, 50, 100];
const num = v => { const n = parseInt(v, 10); return isNaN(n) ? null : n; };
class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.state = { page: num(p.page) || 1, size: num(p.pageSize) || 10, text: p.invalidText != null ? String(p.invalidText) : null, error: p.invalidText != null, open: p.open === true || p.open === 'true' };
  }
  componentDidUpdate(prev) {
    if (prev.page !== this.props.page && num(this.props.page) && num(this.props.page) !== this.state.page) this.setState({ page: num(this.props.page), text: null, error: false });
    if (prev.pageSize !== this.props.pageSize && num(this.props.pageSize)) this.setState({ size: num(this.props.pageSize) });
  }
  go(p) {
    const total = Math.max(1, num(this.props.total) || 1);
    if (p < 1 || p > total) { this.setState({ error: true }); return; }
    this.setState({ page: p, text: null, error: false });
    this.props.onPageChange && this.props.onPageChange(p);
  }
  renderVals() {
    const s = this.state, total = Math.max(1, num(this.props.total) || 1), page = Math.min(s.page, total);
    const md = this.props.size === 'md', floating = this.props.variant === 'floating', mobile = this.props.mobile === true || this.props.mobile === 'true';
    const first = page <= 1, last = page >= total;
    return {
      h: md ? 'var(--mimi-control-height)' : 'calc(var(--mimi-control-height) - 8px)', pad: md ? '4px' : '3px', gap: md ? '6px' : '4px', fs: md ? '14px' : '13px', is: md ? '18' : '16', iw: md ? '52px' : '44px',
      total: String(total), text: s.text !== null ? s.text : String(page), error: s.error, ariaInvalid: String(s.error),
      border: s.error ? 'var(--mimi-destructive)' : 'var(--mimi-input)', ring: s.error ? '0 0 0 3px var(--mimi-destructive-soft)' : 'none',
      shadow: floating ? 'var(--mimi-shadow-popover)' : 'var(--mimi-shadow-neutral)',
      pos: floating ? 'absolute' : 'relative', left: floating ? '50%' : 'auto', bottom: floating ? '16px' : 'auto', tf: floating ? 'translateX(-50%)' : 'none', z: floating ? '10' : 'auto',
      prevDis: first, nextDis: last, prevOp: first ? '.35' : '1', nextOp: last ? '.35' : '1', prevCur: first ? 'not-allowed' : 'pointer', nextCur: last ? 'not-allowed' : 'pointer',
      prev: () => this.go(page - 1), next: () => this.go(page + 1),
      onText: e => this.setState({ text: e.target.value.replace(/\D/g, '').slice(0, 3), error: false }),
      onFocus: e => e.target.select(),
      onKey: e => { if (e.key === 'Enter') { e.preventDefault(); const n = num(s.text !== null ? s.text : page); if (n === null) { this.setState({ error: true }); return; } this.go(n); } else if (e.key === 'Escape') this.setState({ text: null, error: false }); else if (e.key === 'ArrowUp') { e.preventDefault(); this.go(Math.min(total, page + 1)); } else if (e.key === 'ArrowDown') { e.preventDefault(); this.go(Math.max(1, page - 1)); } },
      onBlur: () => { if (!s.error) this.setState({ text: null }); },
      showSize: !mobile, size: String(s.size), open: s.open, ariaOpen: String(s.open), chev: s.open ? 'rotate(180deg)' : 'none', selBg: s.open ? 'var(--mimi-accent)' : 'transparent',
      toggle: () => this.setState({ open: !s.open }), selKey: e => { if (e.key === 'Escape') this.setState({ open: false }); },
      sizes: SIZES.map(n => ({ label: n + ' / pág.', on: n === s.size, aria: String(n === s.size), bg: n === s.size ? 'var(--mimi-accent)' : 'transparent', pick: () => { this.setState({ size: n, open: false, page: 1, text: null, error: false }); this.props.onSizeChange && this.props.onSizeChange(n); } }))
    };
  }
}
</script>
</body>
</html>
